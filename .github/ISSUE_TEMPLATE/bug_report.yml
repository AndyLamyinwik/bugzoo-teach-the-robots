name: Bug report / 問題回報
description: Report a reproducible product problem / 回報可重現的產品問題
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Do not include credentials, private learning records, or identifying screenshots. For sensitive vulnerabilities, follow SECURITY.md instead.
        請勿包含憑據、私人學習紀錄或可識別個人的畫面；敏感漏洞請依 SECURITY.md 回報。
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps / 重現步驟
      description: Include the affected lesson or page and the inputs used / 說明課程或頁面及操作輸入。
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior / 預期與實際結果
      description: What should happen, and what happened instead? / 預期發生什麼，實際發生什麼？
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment / 使用環境
      description: Browser/version, operating system, viewport, language, and deployed URL or local commit if known / 瀏覽器版本、系統、視窗、語言及網址或本地 commit（如已知）。
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Additional details / 補充資料
      description: Optional sanitized logs or screenshots / 可選，僅提供已移除私人資訊的日誌或截圖。
