name: Quality and Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Typecheck, lint, unit tests, build and Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      base_path: ${{ steps.base.outputs.path }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install locked pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          runtime: node@24.19.0
          require-lockfile: true
          cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}
      - name: Determine the real Pages repository path
        id: base
        shell: bash
        run: |
          repo_name="${GITHUB_REPOSITORY#*/}"
          if [[ "${repo_name,,}" == "${GITHUB_REPOSITORY_OWNER,,}.github.io" ]]; then
            base_path="/"
          else
            base_path="/${repo_name}/"
          fi
          echo "BUGZOO_BASE_PATH=$base_path" >> "$GITHUB_ENV"
          echo "BUGZOO_E2E_BASE_URL=http://127.0.0.1:4173$base_path" >> "$GITHUB_ENV"
          echo "path=$base_path" >> "$GITHUB_OUTPUT"
      - name: Verify all engineering checks and build
        run: pnpm check
      - name: Install only Chromium and its system dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: Test the production build at its Pages path
        env:
          BUGZOO_E2E_PRODUCTION: '1'
        run: pnpm test:e2e
      - name: Retain browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-diagnostics
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload only the verified Pages build
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          include-hidden-files: true

  deploy:
    name: Deploy verified build to GitHub Pages
    needs: quality
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Read the actual Pages configuration
        id: pages
        uses: actions/configure-pages@v6
      - name: Confirm the built path matches Pages
        env:
          BUILT_BASE: ${{ needs.quality.outputs.base_path }}
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}
        shell: bash
        run: |
          expected="${PAGES_BASE%/}/"
          if [[ "$BUILT_BASE" != "$expected" ]]; then
            echo "Pages path differs from the verified build; update the build configuration before deploying."
            exit 1
          fi
      - name: Deploy the verified artifact
        id: deployment
        uses: actions/deploy-pages@v5

  public-acceptance:
    name: Verify the real public Pages website
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install locked tools and dependencies
        uses: pnpm/setup@v3
        with:
          runtime: node@24.19.0
          require-lockfile: true
          cache: true
          save-cache: false
      - name: Install only Chromium and its system dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: Test all flows against the deployed public URL
        env:
          BUGZOO_E2E_BASE_URL: ${{ needs.deploy.outputs.page_url }}
          BUGZOO_E2E_EXTERNAL: '1'
        run: pnpm test:e2e
      - name: Retain public browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: public-browser-diagnostics
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
